# Fly.io deployment: `fly launch --copy-config --no-deploy`, then
# `fly volumes create gi_data --size 1`, then `fly deploy`.
app = "genshin-invocation"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data/rooms"

[[mounts]]
  source = "gi_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero when nobody is connected; wake on the next request.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 500
    hard_limit = 800

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
